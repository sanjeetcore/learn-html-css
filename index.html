
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors</title>

    <style>
        /* Color examples */
        h1 {
            /* Color Keywords */
             color: darkred; 

            /* HEX Color Code */
               color: aquamarine; 

            /* RGB */
            /* color: rgb(76, 125, 59); */

            /* RGBA */
            /* color: rgba(255, 22, 5, 0.175); */

            /* HSL */
            color: hsl(130, 61%, 44%);
            background-color: rgb(76, 125, 59);
        }

        p {
            color: blue;
            font-size: 20px;
        }

        li {
            color: darkred;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>Lets learn about colors</h1>

    <p>Color can be represented in:</p>

    <ol>
        <li>Color Keywords</li>
        <li>Hex Color Code</li>
        <li>RGB</li>
        <li>RGBA</li>
        <li>HSL</li>
    </ol>

</body>

</html>
