<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Boxmodel</title>
    <h1>Box Model</h1>
    <style>
        *{
            margin: 10px;
            padding: 0;
        }

        .box {
            background-color:darkgreen;

        }
        .box1{
            color: yellow;
            padding: 10px;
            margin:35px;
            border: 2px solid blue;
            height: 200px;
            box-sizing: border-box;
        }
        .box2{
            color:red;
            padding: 10px;
            margin:25px;
            border: 2px solid black;
            height: 200px;
            box-sizing: border-box;
        }
    </style>
</head>

<body>
    <div class="box box1">
        <p>I am box</p>
    </div>
    <div class="box box2">
        <p>I am another box</p>
        <audio controls>
            <source src="song.mp3" type="audio/mpeg">
            
        </audio>
    </div>
</body>

</html>
