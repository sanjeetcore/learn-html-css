<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            border: 2px solid black;
            padding:34px;
            box-shadow:  5px 15px 5px #70a711;
            list-style-image: url('path/to/image.png');
        }
        .text-element { text-shadow: 10px 5px 3px #219619 }
    </style>
</head>
<body>
    <div class="box">
        I am a box
    </div>

    <p class="text-element">
        I am Sanjeet <br>
        currently pursuing my B.tech in computer science and engineering from GNIT Greater Noida <br>
        I want to become a full stack developer
    </p>
    
</body>
</html>
